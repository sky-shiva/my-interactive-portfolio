<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", monospace;
        }

        body {
            background: black;
            color: #04954d;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #07a152;
            animation: glitch 1.5s infinite;
        }

        p {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #2ce108;
            max-width: 600px;
        }

        .terminal {
            margin-top: 30px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #14cf0a;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            text-align: left;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .terminal span {
            display: block;
            animation: typing 0.8s steps(40) infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }

        @keyframes typing {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <h1>⚠ Hacked By Shiva ⚠</h1>
    <p>
        Our servers are undergoing upgrades.<br>
        Engineers are inside the system.<br>
        Do not attempt access.
    </p>

    <div class="terminal">
        <span>> Initializing secure modules...</span>
        <span>> Patching vulnerabilities...</span>
        <span>> Encrypting endpoints...</span>
        <span>> System will be back online soon.</span>
    </div>
</div>

<script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*";
    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff88";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }

            drops[i]++;
        }
    }

    setInterval(drawMatrix, 35);

    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
